<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý Sửa chữa định kỳ</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue-dark: #1a3a5c;
  --blue: #2b6cb0;
  --blue-light: #ebf8ff;
  --green: #38a169;
  --yellow: #d69e2e;
  --red: #e53e3e;
  --cyan: #0bc5ea;
  --gray: #718096;
  --border: #e2e8f0;
}
body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; background: #f0f4f8; color: #2d3748; min-height: 100vh; }

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, #1a3a5c 0%, #2b6cb0 100%);
  color: #fff;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
  position: sticky;
  top: 0;
  z-index: 200;
}
.header-logo { font-size: 22px; }
.header-title { flex: 1; }
.header-title h1 { font-size: 16px; font-weight: 700; }
.header-title p { font-size: 11px; opacity: .7; margin-top: 1px; }

/* ===== DASHBOARD CARDS ===== */
.dashboard { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  border-left: 4px solid transparent;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform .15s, box-shadow .15s;
  cursor: default;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.card.blue { border-color: var(--blue); }
.card.green { border-color: var(--green); }
.card.yellow { border-color: var(--yellow); }
.card.red { border-color: var(--red); }
.card.cyan { border-color: var(--cyan); }
.card-icon { font-size: 28px; min-width: 36px; text-align: center; }
.card-info { flex: 1; }
.card-value { font-size: 22px; font-weight: 800; line-height: 1; color: #2d3748; }
.card-label { font-size: 11px; color: var(--gray); margin-top: 4px; font-weight: 500; }
.card-sub { font-size: 11px; color: var(--gray); margin-top: 2px; }

/* ===== TOOLBAR ===== */
.toolbar {
  background: #fff;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  position: sticky;
  top: 56px;
  z-index: 190;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.search-box { position: relative; flex: 1; min-width: 200px; max-width: 380px; }
.search-box input {
  width: 100%; padding: 7px 34px 7px 12px;
  border: 1px solid #cbd5e0; border-radius: 8px;
  font-size: 13px; outline: none;
  transition: border .2s, box-shadow .2s;
}
.search-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(43,108,176,.15); }
.search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #a0aec0; font-size: 15px; }
.filter-sel {
  padding: 7px 10px; border: 1px solid #cbd5e0; border-radius: 8px;
  font-size: 13px; outline: none; cursor: pointer; background: #fff; min-width: 150px;
}
.filter-sel:focus { border-color: var(--blue); }
.spacer { flex: 1; }

.btn {
  padding: 7px 14px; border-radius: 8px; font-size: 13px;
  font-weight: 600; cursor: pointer; border: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, transform .1s, box-shadow .15s;
  white-space: nowrap; letter-spacing: .2px;
}
.btn:active { transform: scale(.97); }
.btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #2c5282; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #276749; }
.btn-warning { background: var(--yellow); color: #fff; }
.btn-warning:hover { background: #b7791f; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #c53030; }
.btn-outline { background: #fff; border: 1.5px solid #cbd5e0; color: #4a5568; }
.btn-outline:hover { background: #f7fafc; border-color: #a0aec0; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
.btn-icon { padding: 5px 8px; border-radius: 6px; }

/* ===== MAIN CONTENT ===== */
.main { padding: 0 20px 20px; }

/* ===== PROJECTS LIST ===== */
.project-block {
  background: #fff;
  border-radius: 12px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
  overflow: hidden;
  border: 1px solid var(--border);
  transition: box-shadow .2s;
}
.project-block:hover { box-shadow: 0 3px 12px rgba(0,0,0,.1); }

.project-header {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  background: linear-gradient(90deg, #f7fafc, #fff);
  border-bottom: 2px solid var(--border);
  transition: background .15s;
}
.project-header:hover { background: linear-gradient(90deg, #ebf8ff, #fff); }
.project-toggle {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--blue-dark);
  color: #fff;
  font-size: 13px;
  flex-shrink: 0;
  transition: transform .25s, background .15s;
}
.project-block.open .project-toggle { transform: rotate(90deg); background: var(--blue); }
.project-meta { flex: 1; min-width: 0; }
.project-tuyen {
  display: inline-block;
  background: var(--blue-dark);
  color: #fff;
  padding: 2px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 4px;
}
.project-name {
  font-size: 13px;
  font-weight: 700;
  color: #1a3a5c;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.project-stats { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.project-stat { font-size: 12px; color: var(--gray); display: flex; align-items: center; gap: 4px; }
.project-stat strong { color: #2d3748; }
.project-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ===== ITEMS TABLE ===== */
.items-wrapper {
  display: none;
  overflow-x: auto;
}
.project-block.open .items-wrapper { display: block; }

table { width: 100%; border-collapse: collapse; min-width: 900px; }
thead th {
  background: #2c5282;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 8px 10px;
  text-align: left;
  white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,.1);
  cursor: pointer;
  user-select: none;
  letter-spacing: .3px;
}
thead th:hover { background: var(--blue); }
thead th.sort-asc::after { content: " ▲"; font-size: 9px; }
thead th.sort-desc::after { content: " ▼"; font-size: 9px; }
thead th:last-child { cursor: default; text-align: center; }
tbody tr { border-bottom: 1px solid #f0f4f8; transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f7faff; }
td { padding: 8px 10px; vertical-align: middle; border-right: 1px solid #f0f4f8; }
td.center { text-align: center; }
td.right { text-align: right; }
td.actions-td { text-align: center; white-space: nowrap; width: 90px; }
td.idx { text-align: center; color: #a0aec0; font-size: 11px; width: 36px; }

.items-footer {
  padding: 8px 16px;
  font-size: 12px;
  color: var(--gray);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fafbfc;
}
.items-footer strong { color: #2d3748; }

/* ===== BADGE ===== */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.badge-bh { background: #fef3c7; color: #92400e; }
.badge-ht { background: #d1fae5; color: #065f46; }
.badge-tc { background: #dbeafe; color: #1e40af; }
.badge-td { background: #fee2e2; color: #991b1b; }
.badge-gray { background: #f1f5f9; color: #475569; }

/* ===== EMPTY ===== */
.empty-projects { text-align: center; padding: 60px 20px; color: #a0aec0; }
.empty-icon { font-size: 56px; margin-bottom: 14px; }
.empty-items { text-align: center; padding: 24px; color: #a0aec0; font-size: 13px; }

/* ===== MODALS ===== */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.55);
  z-index: 500;
  align-items: flex-start;
  justify-content: center;
  overflow-y: auto;
  padding: 24px 16px;
  backdrop-filter: blur(2px);
}
.overlay.active { display: flex; }

/* FULLSCREEN DETAIL */
.modal-full {
  background: #fff;
  border-radius: 14px;
  width: 100%;
  max-width: 860px;
  box-shadow: 0 24px 80px rgba(0,0,0,.35);
  margin: auto;
  overflow: hidden;
}
.modal-full-header {
  background: linear-gradient(135deg, var(--blue-dark), var(--blue));
  color: #fff;
  padding: 20px 24px 0;
}
.modal-full-header .badge { background: rgba(255,255,255,.2); color: #fff; margin-bottom: 8px; }
.modal-full-header h2 { font-size: 15px; font-weight: 700; line-height: 1.5; margin-bottom: 16px; }
.modal-tabs { display: flex; gap: 4px; }
.modal-tab {
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,.6);
  cursor: pointer;
  border-radius: 8px 8px 0 0;
  transition: background .15s, color .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.modal-tab:hover { color: rgba(255,255,255,.85); background: rgba(255,255,255,.1); }
.modal-tab.active { background: #fff; color: var(--blue-dark); }
.modal-full-body { padding: 24px; min-height: 300px; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.modal-full-footer {
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: #fafbfc;
}

/* INFO GRID */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.info-item { padding: 12px 14px; background: #f7fafc; border-radius: 8px; border-left: 3px solid var(--border); }
.info-item.full { grid-column: 1 / -1; }
.info-item.blue-border { border-color: var(--blue); }
.info-item.green-border { border-color: var(--green); }
.info-item.yellow-border { border-color: var(--yellow); }
.info-item.red-border { border-color: var(--red); }
.info-label { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
.info-value { font-size: 13px; color: #2d3748; font-weight: 500; line-height: 1.5; word-break: break-word; }
.info-value.money { font-size: 16px; font-weight: 800; color: var(--blue-dark); }
.timeline { display: flex; flex-direction: column; gap: 12px; }
.timeline-item { display: flex; gap: 14px; align-items: flex-start; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
.tl-dot.blue { background: var(--blue); }
.tl-dot.green { background: var(--green); }
.tl-dot.yellow { background: var(--yellow); }
.tl-dot.red { background: var(--red); }
.tl-line { width: 2px; background: var(--border); margin: 3px auto; height: 20px; }
.tl-content { flex: 1; }
.tl-title { font-size: 12px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: .3px; }
.tl-date { font-size: 14px; font-weight: 600; color: #2d3748; margin-top: 2px; }
.hangmuc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.hangmuc-table th { background: #f7fafc; padding: 8px 10px; font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: .3px; border-bottom: 2px solid var(--border); text-align: left; }
.hangmuc-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.hangmuc-table tr:last-child td { border-bottom: none; }

/* FORM MODAL */
.modal-form { max-width: 820px; border-radius: 14px; }
.modal-form-header {
  background: linear-gradient(135deg, var(--blue-dark), var(--blue));
  color: #fff; padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-form-header h2 { font-size: 15px; font-weight: 700; }
.close-btn { background: none; border: none; color: rgba(255,255,255,.7); font-size: 22px; cursor: pointer; line-height: 1; padding: 0 2px; }
.close-btn:hover { color: #fff; }
.modal-form-body { padding: 20px; max-height: 72vh; overflow-y: auto; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fg { display: flex; flex-direction: column; gap: 4px; }
.fg.full { grid-column: 1 / -1; }
.fg label { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: .3px; }
.fg label .req { color: var(--red); }
.fg input, .fg select, .fg textarea {
  padding: 8px 11px; border: 1px solid #cbd5e0;
  border-radius: 8px; font-size: 13px; outline: none;
  transition: border .2s, box-shadow .2s; font-family: inherit; background: #fff;
}
.fg input:focus, .fg select:focus, .fg textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(43,108,176,.15);
}
.fg textarea { resize: vertical; min-height: 64px; }
.form-divider { grid-column: 1/-1; border: none; border-top: 1.5px dashed var(--border); margin: 4px 0; }
.form-section { grid-column: 1/-1; font-size: 11px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .5px; padding: 4px 0 2px; border-bottom: 1.5px solid var(--blue-light); margin-bottom: 2px; }
.modal-form-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
  background: #fafbfc;
}

/* CONFIRM */
.modal-confirm { max-width: 420px; border-radius: 14px; overflow: hidden; }
.modal-confirm-header { background: linear-gradient(135deg, #c53030, var(--red)); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
.modal-confirm-header h2 { font-size: 14px; font-weight: 700; }
.modal-confirm-body { padding: 28px 20px; text-align: center; }
.confirm-icon { font-size: 48px; margin-bottom: 12px; }
.modal-confirm-body p { color: #4a5568; line-height: 1.6; }
.modal-confirm-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: #fafbfc; }

/* TOAST */
.toast-zone { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 16px; border-radius: 10px; color: #fff;
  font-size: 13px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2);
  animation: toastIn .3s ease; max-width: 320px; display: flex; align-items: center; gap: 8px;
}
.toast-success { background: var(--green); }
.toast-error { background: var(--red); }
.toast-info { background: var(--blue); }
@keyframes toastIn { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { from { transform: none; opacity: 1; } to { transform: translateX(110%); opacity: 0; } }

/* RESPONSIVE */
@media (max-width: 640px) {
  .form-grid, .info-grid { grid-template-columns: 1fr; }
  .fg.full { grid-column: 1; }
  .info-item.full { grid-column: 1; }
  .modal-tabs { overflow-x: auto; }
  .dashboard { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-logo">🛣️</div>
  <div class="header-title">
    <h1>Quản lý Sửa chữa định kỳ công trình đường bộ</h1>
    <p>Hệ thống quản lý hợp đồng thi công, bàn giao và bảo hành</p>
  </div>
</div>

<!-- DASHBOARD CARDS -->
<div class="dashboard" id="dashboard"></div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm theo tên công trình, hạng mục, lý trình..." oninput="applyFilter()">
    <span class="search-icon">🔍</span>
  </div>
  <select class="filter-sel" id="filterTuyen" onchange="applyFilter()">
    <option value="">— Tất cả tuyến —</option>
  </select>
  <select class="filter-sel" id="filterTinhTrang" onchange="applyFilter()">
    <option value="">— Tất cả tình trạng —</option>
  </select>
  <button class="btn btn-outline" onclick="clearFilters()">✕ Xoá lọc</button>
  <div class="spacer"></div>
  <button class="btn btn-primary" onclick="openAdd()">+ Thêm mới</button>
  <button class="btn btn-success" onclick="exportExcel()">↓ Xuất Excel</button>
  <label class="btn btn-warning" style="cursor:pointer">↑ Nhập Excel
    <input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(this)">
  </label>
</div>

<!-- MAIN -->
<div class="main" id="main"></div>

<!-- ===== DETAIL MODAL (FULLSCREEN) ===== -->
<div class="overlay" id="viewOverlay">
  <div class="modal-full">
    <div class="modal-full-header">
      <span class="badge" id="viewTuyen"></span>
      <h2 id="viewTitle"></h2>
      <div class="modal-tabs" id="modalTabs">
        <div class="modal-tab active" onclick="switchTab(0)" data-tab="0">📋 Thông tin chung</div>
        <div class="modal-tab" onclick="switchTab(1)" data-tab="1">📅 Tiến độ</div>
        <div class="modal-tab" onclick="switchTab(2)" data-tab="2">🛡️ Bảo hành</div>
        <div class="modal-tab" onclick="switchTab(3)" data-tab="3">🔧 Hạng mục</div>
      </div>
    </div>
    <div class="modal-full-body">
      <div class="tab-pane active" id="tab0"></div>
      <div class="tab-pane" id="tab1"></div>
      <div class="tab-pane" id="tab2"></div>
      <div class="tab-pane" id="tab3"></div>
    </div>
    <div class="modal-full-footer">
      <button class="btn btn-outline" onclick="closeView()">Đóng</button>
      <button class="btn btn-warning" id="viewEditBtn">✏️ Sửa bản ghi</button>
    </div>
  </div>
</div>

<!-- ===== FORM MODAL ===== -->
<div class="overlay" id="formOverlay">
  <div class="modal-form">
    <div class="modal-form-header">
      <h2 id="formTitle">Thêm mới bản ghi</h2>
      <button class="close-btn" onclick="closeForm()">✕</button>
    </div>
    <div class="modal-form-body">
      <div class="form-grid">
        <div class="fg">
          <label>Tuyến đường <span class="req">*</span></label>
          <input type="text" id="f_lo_tuyen" placeholder="VD: CT.HN_HP_CT04">
        </div>
        <div class="fg">
          <label>Tình trạng</label>
          <select id="f_tinhTrang">
            <option value="">— Chọn —</option>
            <option>Đang bảo hành</option>
            <option>Hết bảo hành</option>
            <option>Đang thi công</option>
            <option>Hoàn thành</option>
            <option>Tạm dừng</option>
          </select>
        </div>
        <div class="fg full">
          <label>Tên công trình / Dự án <span class="req">*</span></label>
          <textarea id="f_tenCongTrinh" rows="3" placeholder="Nhập tên công trình..."></textarea>
        </div>
        <div class="fg">
          <label>Tổng mức đầu tư (VNĐ)</label>
          <input type="number" id="f_tongMucDauTu" placeholder="0" min="0">
        </div>
        <div class="fg">
          <label>Đơn vị thiết kế</label>
          <input type="text" id="f_donViThietKe">
        </div>
        <div class="fg">
          <label>Đơn vị giám sát</label>
          <input type="text" id="f_donViGiamSat">
        </div>
        <div class="fg">
          <label>Đơn vị thi công</label>
          <input type="text" id="f_donViThiCong">
        </div>
        <hr class="form-divider">
        <div class="form-section">📅 Tiến độ thi công</div>
        <div class="fg">
          <label>Thi công từ ngày</label>
          <input type="date" id="f_tuNgayThiCong">
        </div>
        <div class="fg">
          <label>Thi công đến ngày</label>
          <input type="date" id="f_denNgayThiCong">
        </div>
        <div class="fg">
          <label>Ngày bàn giao</label>
          <input type="date" id="f_ngayBanGiao">
        </div>
        <div class="fg">
          <label>Số biên bản bàn giao</label>
          <input type="text" id="f_soBienBanBanGiao">
        </div>
        <hr class="form-divider">

// ===================== HELPERS =====================
function fmtMoney(v) {
  if (v == null || v === '') return '—';
  return new Intl.NumberFormat('vi-VN', {maximumFractionDigits:0}).format(v) + ' ₫';
}
function fmtNum(v) {
  if (v == null || v === '') return '—';
  return new Intl.NumberFormat('vi-VN').format(v);
}
function fmtDate(v) { return v || '—'; }
function dash(v) { return v != null && v !== '' ? v : '—'; }
function projectKey(r) { return (r.lo_tuyen || '') + '||' + (r.tenCongTrinh || ''); }

function badgeHtml(v) {
  if (!v) return '<span style="color:#a0aec0">—</span>';
  if (v.toLowerCase().includes('bảo hành')) return `<span class="badge badge-bh">${v}</span>`;
  if (v.toLowerCase().includes('hoàn thành')) return `<span class="badge badge-ht">${v}</span>`;
  if (v.toLowerCase().includes('thi công')) return `<span class="badge badge-tc">${v}</span>`;
  if (v.toLowerCase().includes('tạm dừng')) return `<span class="badge badge-td">${v}</span>`;
  return `<span class="badge badge-gray">${v}</span>`;
}

function groupProjects(arr) {
  const map = new Map();
  arr.forEach(r => {
    const k = projectKey(r);
    if (!map.has(k)) map.set(k, { key: k, lo_tuyen: r.lo_tuyen, tenCongTrinh: r.tenCongTrinh, tinhTrang: r.tinhTrang, tongMucDauTu: r.tongMucDauTu, donViThietKe: r.donViThietKe, donViGiamSat: r.donViGiamSat, donViThiCong: r.donViThiCong, tuNgayThiCong: r.tuNgayThiCong, denNgayThiCong: r.denNgayThiCong, ngayBanGiao: r.ngayBanGiao, soBienBanBanGiao: r.soBienBanBanGiao, tuNgayBaoHanh: r.tuNgayBaoHanh, denNgayBaoHanh: r.denNgayBaoHanh, ngayXoaBaoHanh: r.ngayXoaBaoHanh, soBienBanXoaBaoHanh: r.soBienBanXoaBaoHanh, items: [] });
    map.get(k).items.push(r);
  });
  return [...map.values()];
}

// ===================== FILTER =====================
function applyFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const tuyen = document.getElementById('filterTuyen').value;
  const tinhTrang = document.getElementById('filterTinhTrang').value;

  let arr = data;
  if (tuyen) arr = arr.filter(r => r.lo_tuyen === tuyen);
  if (tinhTrang) arr = arr.filter(r => r.tinhTrang === tinhTrang);
  if (q) arr = arr.filter(r => {
    const hay = [r.lo_tuyen, r.tenCongTrinh, r.tinhTrang, r.donViThietKe, r.donViGiamSat, r.donViThiCong, r.tenHangMuc, r.lyTrinhDau, r.lyTrinhCuoi].join(' ').toLowerCase();
    return hay.includes(q);
  });

  renderDashboard(arr);
  renderProjects(groupProjects(arr));
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterTuyen').value = '';
  document.getElementById('filterTinhTrang').value = '';
  applyFilter();
}

// ===================== PROJECTS =====================
const openProjects = new Set();

function renderProjects(projects) {
  const main = document.getElementById('main');
  if (projects.length === 0) {
    main.innerHTML = '<div class="empty-projects"><div class="empty-icon">📋</div><p>Không tìm thấy dữ liệu phù hợp</p></div>';
    return;
  }
  main.innerHTML = projects.map((p, pi) => renderProjectBlock(p, pi)).join('');
}

function renderProjectBlock(p, pi) {
  const isOpen = openProjects.has(p.key);
  const itemsHtml = p.items.map((r, i) => `
    <tr>
      <td class="idx">${i+1}</td>
      <td><strong>${r.tenHangMuc || '<span style="color:#a0aec0">—</span>'}</strong></td>

      <td class="center">${dash(r.lyTrinhCuoi)}</td>

      <td class="center">${dash(r.donViTinh)}</td>
      <td class="actions-td">

        <button class="btn btn-danger btn-sm btn-icon" title="Xoá" onclick="askDelete(${r.id})">🗑</button>

      </div>
      <div class="project-stats">
        ${badgeHtml(p.tinhTrang)}
        <div class="project-stat">💰 <strong>${new Intl.NumberFormat('vi-VN',{notation:'compact',maximumFractionDigits:1}).format(p.tongMucDauTu||0)}₫</strong></div>
        <div class="project-stat">🔧 <strong>${p.items.length}</strong> hạng mục</div>
        <div class="project-stat">📅 <strong>${p.tuNgayBaoHanh||'—'}</strong> → <strong>${p.denNgayBaoHanh||'—'}</strong></div>
      </div>
      <div class="project-actions" onclick="event.stopPropagation()">
        <button class="btn btn-primary btn-sm" onclick="openAddToProject('${escKey}')">+ Thêm HM</button>
        <button class="btn btn-outline btn-sm" onclick="viewProjectDetail('${escKey}')">📋 Chi tiết</button>

    <div class="items-wrapper">
      ${p.items.length > 0 ? `
      <table>
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Hạng mục</th>
            <th style="min-width:110px">Lý trình đầu</th>
            <th style="min-width:110px">Lý trình cuối</th>
            <th style="min-width:90px">Khối lượng</th>
            <th style="min-width:80px">ĐVT</th>
            <th style="width:90px">Thao tác</th>

        </thead>
        <tbody>${itemsHtml}</tbody>
      </table>
      <div class="items-footer">
        <span>Tổng: <strong>${p.items.length}</strong> hạng mục</span>
        <span style="margin-left:auto;color:#a0aec0;font-size:11px">ĐV Thiết kế: ${p.donViThietKe||'—'} | ĐV Giám sát: ${p.donViGiamSat||'—'} | ĐV Thi công: ${p.donViThiCong||'—'}</span>

}

function toggleProject(blockId, key) {
  const el = document.getElementById(blockId);
  if (!el) return;
  el.classList.toggle('open');
  if (el.classList.contains('open')) openProjects.add(key);
  else openProjects.delete(key);
}

function viewProjectDetail(key) {
  const items = data.filter(r => projectKey(r) === key);
  if (items.length === 0) return;
  viewRecord(items[0].id);
  setTimeout(() => switchTab(3), 100);
}

function switchTab(idx) {
  document.querySelectorAll('.modal-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab-pane').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function closeView() { document.getElementById('viewOverlay').classList.remove('active'); }

// ===================== CRUD =====================
function openAdd() {
  editId = null;
  document.getElementById('formTitle').textContent = 'Thêm mới bản ghi';
  FIELDS.forEach(f => { const el = document.getElementById('f_' + f); if (el) el.value = ''; });
  document.getElementById('formOverlay').classList.add('active');
}

function openAddToProject(key) {
  const sample = data.find(r => projectKey(r) === key);
  editId = null;
  document.getElementById('formTitle').textContent = 'Thêm hạng mục vào công trình';
  FIELDS.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (!el) return;
    const projectFields = ['lo_tuyen','tenCongTrinh','tinhTrang','tongMucDauTu','donViThietKe','donViGiamSat','donViThiCong','tuNgayThiCong','denNgayThiCong','ngayBanGiao','soBienBanBanGiao','tuNgayBaoHanh','denNgayBaoHanh','ngayXoaBaoHanh','soBienBanXoaBaoHanh'];
    if (sample && projectFields.includes(f)) el.value = sample[f] != null ? sample[f] : '';
    else el.value = '';
  });
  document.getElementById('formOverlay').classList.add('active');
}

function openEdit(id) {
  const r = data.find(x => x.id === id);
  if (!r) return;
  editId = id;
  document.getElementById('formTitle').textContent = 'Sửa hạng mục #' + id;
  FIELDS.forEach(f => { const el = document.getElementById('f_' + f); if (el) el.value = r[f] != null ? r[f] : ''; });
  document.getElementById('formOverlay').classList.add('active');
}

function closeForm() { document.getElementById('formOverlay').classList.remove('active'); }

function saveRecord() {
  const lo = document.getElementById('f_lo_tuyen').value.trim();
  const ct = document.getElementById('f_tenCongTrinh').value.trim();
  const hm = document.getElementById('f_tenHangMuc').value.trim();
  if (!lo) { toast('Vui lòng nhập Tuyến đường!', 'error'); return; }
  if (!ct) { toast('Vui lòng nhập Tên công trình!', 'error'); return; }
  if (!hm) { toast('Vui lòng nhập Hạng mục!', 'error'); return; }

  const rec = {};
  FIELDS.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (!el) { rec[f] = null; return; }
    let v = el.value.trim();
    if (f === 'tongMucDauTu' || f === 'khoiLuong') v = v !== '' ? parseFloat(v) : null;
    else v = v || null;
    rec[f] = v;
  });

  if (editId) {
    const idx = data.findIndex(x => x.id === editId);
    if (idx >= 0) data[idx] = { ...data[idx], ...rec };
    toast('Đã cập nhật bản ghi #' + editId, 'success');
  } else {
    rec.id = nextId++;
    data.push(rec);
    toast('Đã thêm hạng mục mới', 'success');
  }
  closeForm();
  applyFilter();
}

function askDelete(id) {
  const r = data.find(x => x.id === id);
  deleteId = id;
  document.getElementById('confirmDesc').textContent = r ? (r.tenHangMuc || 'Hạng mục #' + id) : 'ID ' + id;
  document.getElementById('confirmOverlay').classList.add('active');
}

function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('active'); }

function doDelete() {
  data = data.filter(x => x.id !== deleteId);
  closeConfirm();
  toast('Đã xoá hạng mục', 'success');
  applyFilter();
}

// ===================== EXPORT =====================
function exportExcel() {
  const headers = ['Tuyến đường','Công trình/Dự án','Tình trạng','Tổng mức đầu tư','ĐV Thiết kế','ĐV Giám sát','ĐV Thi công','Thi công từ','Thi công đến','Ngày BG','Số BB BG','BH từ','BH đến','Ngày xoá BH','Số BB xoá BH','Hạng mục','Lý trình đầu','Lý trình cuối','Khối lượng','ĐVT'];
  const rows = [headers];
  data.forEach(r => rows.push(FIELDS.map(f => r[f] != null ? r[f] : '')));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [12,42,15,18,14,14,14,13,13,13,14,13,13,14,18,32,14,14,12,10].map(w => ({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'SuaChuaDinhKy');
  XLSX.writeFile(wb, `SuaChuaDinhKy_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Đã xuất file Excel', 'success');
}

// ===================== IMPORT =====================
function importExcel(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'binary', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
      if (rows.length < 2) { toast('File không có dữ liệu!', 'error'); return; }
      const hdNorm = rows[0].map(h => String(h||'').trim().toLowerCase().replace(/\s+/g,''));
      const MAP = {
        'tuyếnđường':'lo_tuyen','lo_tuyen':'lo_tuyen',
        'côngtrình/dựán':'tenCongTrinh','tencongTrinh':'tenCongTrinh',
        'tìnhtrạng':'tinhTrang','tinhtrang':'tinhTrang',
        'tổngmứcđầutư':'tongMucDauTu','tongmucdautu':'tongMucDauTu',
        'đvthiếtkế':'donViThietKe','donvithietke':'donViThietKe',
        'đvgiámsát':'donViGiamSat','donvigiamsat':'donViGiamSat',
        'đvthicông':'donViThiCong','donvithicong':'donViThiCong',
        'thicôngtừngày':'tuNgayThiCong','tungaythicong':'tuNgayThiCong',
        'thicôngđếnngày':'denNgayThiCong','denngaythicong':'denNgayThiCong',
        'ngàybàngiao':'ngayBanGiao',
        'sốbbBG':'soBienBanBanGiao','sốbbbàngiao':'soBienBanBanGiao',
        'bhTừngày':'tuNgayBaoHanh','bảohànhtừngày':'tuNgayBaoHanh',
        'bhĐếnngày':'denNgayBaoHanh','bảohànhđếnngày':'denNgayBaoHanh',
        'ngàyxoábh':'ngayXoaBaoHanh','ngàyxoábảohành':'ngayXoaBaoHanh',
        'sốbbxoábh':'soBienBanXoaBaoHanh',
        'hạngmục':'tenHangMuc','tenhangmuc':'tenHangMuc',
        'lýtrìnhđầu':'lyTrinhDau','lytrinhdau':'lyTrinhDau',
        'lýtrìnhcuối':'lyTrinhCuoi','lytrhincuoi':'lyTrinhCuoi',
        'khốilượng':'khoiLuong','khoiluong':'khoiLuong',
        'đơnvịtính':'donViTinh','donvitinh':'donViTinh'
      };
      const fi = {};
      hdNorm.forEach((h, i) => { const k = MAP[h]; if (k) fi[k] = i; });
      let cnt = 0;
      for (let ri = 1; ri < rows.length; ri++) {
        const row = rows[ri];
        if (!row || row.every(c => c == null || c === '')) continue;
        const rec = {id: nextId++};
        FIELDS.forEach(f => {
          let v = fi[f] !== undefined ? row[fi[f]] : null;
          if (v instanceof Date) v = v.toISOString().slice(0,10);
          if (typeof v === 'string') v = v.trim() || null;
          rec[f] = v;
        });
        data.push(rec);
        cnt++;
      }
      applyFilter();
      toast(`Đã nhập ${cnt} bản ghi`, 'success');
    } catch(err) { toast('Lỗi đọc file: ' + err.message, 'error'); }
    input.value = '';
  };
  reader.readAsBinaryString(file);
}

// ===================== TOAST =====================
function toast(msg, type='info') {
  const icons = {success:'✅', error:'❌', info:'ℹ️'};
  const zone = document.getElementById('toastZone');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span> ${msg}`;
  zone.appendChild(el);
  setTimeout(() => { el.style.animation='toastOut .3s ease forwards'; setTimeout(()=>el.remove(),300); }, 3000);
}

// ===================== INIT =====================
function init() {
  // Populate filters
  const tSel = document.getElementById('filterTuyen');
  const ttSel = document.getElementById('filterTinhTrang');
  [...new Set(data.map(r => r.lo_tuyen).filter(Boolean))].sort().forEach(v =>
    tSel.insertAdjacentHTML('beforeend', `<option value="${v}">${v}</option>`));
  [...new Set(data.map(r => r.tinhTrang).filter(Boolean))].sort().forEach(v =>
    ttSel.insertAdjacentHTML('beforeend', `<option value="${v}">${v}</option>`));

  // Open first project by default
  const firstKey = data.length ? projectKey(data[0]) : null;
  if (firstKey) openProjects.add(firstKey);

  applyFilter();
}

// Close overlays on backdrop click
['viewOverlay','formOverlay','confirmOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') ['viewOverlay','formOverlay','confirmOverlay'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
});

init();
</script>
